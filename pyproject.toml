[project]
name = "revision-rag"
version = "0.1.0"
description = "Self-hosted YouTube revision knowledge base with timestamped citations"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = []

[tool.uv.workspace]
members = ["core", "backend"]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
extraPaths = ["core/src", "backend/src", "."]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["core/tests", "backend/tests", "retrieval_service/tests"]
pythonpath = ["core/src", "backend/src", "."]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: integration tests requiring network access",
]
