[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lectra-core"
version = "0.1.0"
description = "Core models, configuration, database, and background worker for Revision RAG"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "python-dotenv>=1.0.0",
    "qdrant-client>=1.13.0",
    "groq>=0.9.0",
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "yt-dlp>=2025.10.22",
    "faster-whisper>=1.0.0",
    "av>=11.0.0,<14.0.0",
]

[project.scripts]
lectra-worker = "lectra_core.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lectra_core"]
